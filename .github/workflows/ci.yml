name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        framework:
          - { laravel: "^10.0", testbench: "^8.0" }
          - { laravel: "^11.0", testbench: "^9.0" }
          - { laravel: "^12.0", testbench: "^10.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Resolve framework versions
        run: |
          composer require --no-update "illuminate/auth:${{ matrix.framework.laravel }}" \
            "illuminate/contracts:${{ matrix.framework.laravel }}" "illuminate/database:${{ matrix.framework.laravel }}" \
            "illuminate/http:${{ matrix.framework.laravel }}" "illuminate/mail:${{ matrix.framework.laravel }}" \
            "illuminate/routing:${{ matrix.framework.laravel }}" "illuminate/session:${{ matrix.framework.laravel }}" \
            "illuminate/support:${{ matrix.framework.laravel }}" "orchestra/testbench:${{ matrix.framework.testbench }}"
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Tests
        run: composer test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer update --prefer-dist --no-interaction
      - name: Composer audit
        run: composer audit
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
